<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>链上交易可视化 · AI+区块链区域协同教研</title>
<style>
  :root { --bg:#0b1220; --card:#111c30; --line:#22314f; --txt:#e8eefc; --sub:#93a4c4; --acc:#4da3ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:"Microsoft YaHei",sans-serif; padding:28px 4vw; }
  h1 { font-size:26px; margin-bottom:4px; }
  .sub { color:var(--sub); margin-bottom:18px; }
  .bar { display:flex; gap:10px; margin-bottom:24px; }
  input { flex:1; background:var(--card); border:1px solid var(--line); color:var(--txt);
          padding:12px 14px; border-radius:8px; font-size:14px; }
  button { background:var(--acc); border:0; color:#04101f; font-weight:bold; padding:12px 26px;
           border-radius:8px; cursor:pointer; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .tag { display:inline-block; background:rgba(77,163,255,.15); color:var(--acc); font-size:12px;
         padding:3px 10px; border-radius:20px; margin-bottom:10px; }
  .hash { color:var(--sub); font-size:11px; word-break:break-all; margin-bottom:10px; }
  table { width:100%; border-collapse:collapse; }
  td { padding:6px 4px; border-bottom:1px dashed var(--line); font-size:13px; vertical-align:top;}
  td.k { color:var(--sub); width:76px; white-space:nowrap; }
  td.v { word-break:break-all; }
  pre { background:#0d1526; border:1px solid var(--line); border-radius:8px; padding:12px;
        font-size:11px; white-space:pre-wrap; word-break:break-all; color:#bcd0f0; max-height:340px; overflow:auto;}
  h2 { font-size:18px; margin:26px 0 12px; }
  .note { color:var(--sub); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<h1>链上交易可视化</h1>
<div class="sub">蚂蚁链开放联盟链 a00e36c5 ｜ 数据来自真实交易回执 ｜ 查询经本地 RestChainTool 实时查链</div>

<div class="bar">
  <input id="h" placeholder="粘贴 64 位交易哈希，回车或点击查询（实时查链）">
  <button onclick="query()">查 询</button>
</div>
<pre id="out">查询结果将显示在这里…</pre>
<div class="note">提示：查询走本机 tools/RestChainTool（SHA256withRSA 握手 + QUERYRECEIPT/QUERYTRANSACTION）；链上偶发限流(211)时等几秒重试。</div>

<h2>已上链的业务记录（miniappinfo 卡片）</h2>
<div class="grid" id="cards"></div>

<script>
function card(it) {
  const rows = it.json.lists.map(x =>
    `<tr><td class="k">${x.name}</td><td class="v">${x.value}</td></tr>`).join('');
  const prev = it.json.prevHash ? `<tr><td class="k">prevHash</td><td class="v">${it.json.prevHash}</td></tr>` : '';
  return `<div class="card"><span class="tag">${it.tag}</span>
    <div class="hash">txHash: ${it.hash}</div>
    <table>${rows}${prev}</table></div>`;
}
fetch('/api/showcase').then(r => r.json()).then(d => {
  document.getElementById('cards').innerHTML = d.map(card).join('');
});
function query() {
  const h = document.getElementById('h').value.trim();
  const out = document.getElementById('out');
  out.textContent = '正在查链…';
  fetch('/api/query?hash=' + encodeURIComponent(h)).then(r => r.json()).then(d => {
    out.textContent = d.raw || JSON.stringify(d, null, 2);
  }).catch(e => out.textContent = '查询失败: ' + e);
}
document.getElementById('h').addEventListener('keydown', e => { if (e.key === 'Enter') query(); });
</script>
</body>
</html>
